monitor = ,preferred,auto,1
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = QT_QPA_PLATFORM,wayland
env = GDK_BACKEND,wayland,x11,*
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = XCURSOR_SIZE,24
# GPU: hybrid mode — desktop on Intel, games via prime-run on NVIDIA
# NVIDIA DRM is enabled via kernel param for PRIME offload support.
# Per-app NVIDIA: prime-run <app>
env = WLR_NO_HARDWARE_CURSORS,1

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = hyprpaper
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = hyprpolkitagent
exec-once = nm-applet --indicator
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

general {
    gaps_in = 7
    gaps_out = 14
    border_size = 2
    col.active_border = rgba(cba6f7ff) rgba(a855f7ff) 45deg
    col.inactive_border = rgba(261d36ff)
    layout = dwindle
}
group {
    col.border_active = rgba(cba6f7ff) rgba(a855f7ff) 45deg
    col.border_inactive = rgba(261d36ff)
    col.border_locked_active = rgba(f5c2e7ff) rgba(cba6f7ff) 45deg
    col.border_locked_inactive = rgba(261d36ff)

    groupbar {
        font_family = JetBrainsMono Nerd Font
        font_size = 11
        height = 24
        render_titles = true
        gradients = true
        text_color = rgba(e2d9f3ff)
        col.active = rgba(7e22ceff)
        col.inactive = rgba(261d36cc)
        col.locked_active = rgba(a855f7ff)
        col.locked_inactive = rgba(261d36cc)
    }
}

# Smart gaps: 0 gaps and 0 outer margins when only 1 window/group or fullscreen
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
decoration {
    rounding = 10
    shadow {
        enabled = true
        range = 14
        render_power = 3
        color = rgba(11111bcc)
    }
}
animations {
    enabled = true
    bezier = smooth, 0.25, 0.9, 0.1, 1.0
    animation = windows, 1, 5, smooth, popin 85%
    animation = border, 1, 5, smooth
    animation = fade, 1, 5, smooth
    animation = workspaces, 1, 4, smooth, slide
}
input {
    kb_layout = us,ara
    kb_options = grp:ctrl_space_toggle
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}
binds {
    movefocus_cycles_groupfirst = true
}
misc {
    disable_hyprland_logo = true
    focus_on_activate = true
}

$mainMod = SUPER
$terminal = kitty

