    float = true
}
windowrule {
    name = class:^(nm-connection-editor)$
    float = true
}
windowrule {
    name = class:^(nm-applet)$
    float = true
}
windowrule {
    name = class:^(.blueman-manager-wrapped)$
    float = true
}
windowrule {
    name = class:^(qt5ct)$
    float = true
}
windowrule {
    name = class:^(qt6ct)$
    float = true
}
windowrule {
    name = class:^(nwg-look)$
    float = true
}
windowrule {
