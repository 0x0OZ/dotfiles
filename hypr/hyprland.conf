    float = true
}
windowrule {
    name = class:^(org.gnome.Loupe)$
    float = true
}
windowrule {
    name = class:^(feh)$
    float = true
}
windowrule {
    name = class:^(Minecraft Launcher)$, title:^(Sign in)(.*)$
    float = true
}
windowrule {
    name = class:^(Minecraft Launcher)$, title:^(Microsoft)(.*)$
