    name = class:^(xsane)$
    float = true
}
# Enable workspace switching when an application requests activation / notification click
windowrule {
    name = class:^(.*)$
    focus_on_activate = true
}

#######################################
# Applications and session            #
#######################################
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod SHIFT, RETURN, exec, terminator
bind = $mainMod, D, exec, wofi --show drun
bind = $mainMod SHIFT, D, exec, wofi --show drun
bind = $mainMod, N, exec, dolphin
bind = , F1, exec, /home/oz/.config/hypr/scripts/keyhint
bind = $mainMod, slash, exec, /home/oz/.config/hypr/scripts/keyhint

# Kill focused window (Super+Shift+Q like i3's $mod+Shift+q)
bind = $mainMod SHIFT, Q, killactive
# Exit Hyprland — triple modifier to avoid accidents
bind = $mainMod CTRL SHIFT, Q, exit

bind = $mainMod, L, exec, hyprlock
bind = $mainMod SHIFT, L, exec, hyprlock

# Reload config (both Shift+C and Shift+R)
bind = $mainMod SHIFT, C, exec, hyprctl reload
bind = $mainMod SHIFT, R, exec, hyprctl reload

# Power menu
bind = $mainMod SHIFT, E, exec, wofi --show dmenu <<< $'Logout\nSuspend\nReboot\nShutdown' | xargs -I{} sh -c 'case "{}" in Logout) hyprctl dispatch exit;; Suspend) systemctl suspend;; Reboot) systemctl reboot;; Shutdown) systemctl poweroff;; esac'

#######################################
# Layouts and focused-window state    #
#######################################
bind = $mainMod, W, togglegroup
bind = $mainMod, E, layoutmsg, togglesplit
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, SPACE, togglefloating
bind = $mainMod SHIFT, SPACE, exec, hyprctl dispatch moveoutofgroup; hyprctl dispatch togglefloating

# Alt+Tab / Alt+Shift+Tab: cycle tabs in group
bind = ALT, TAB, changegroupactive, f
bind = ALT SHIFT, TAB, changegroupactive, b

#######################################
# Clipboard and screenshots           #
#######################################
bind = $mainMod, C, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind = $mainMod, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind = $mainMod SHIFT, S, exec, env XDG_CURRENT_DESKTOP=sway flameshot gui
bind = , PRINT, exec, env XDG_CURRENT_DESKTOP=sway flameshot gui

#######################################
# Focus: arrows and i3 J/K/B/O keys  #
#######################################
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d
bind = $mainMod, J, movefocus, l
bind = $mainMod, K, movefocus, d
bind = $mainMod, O, movefocus, r
# Super+B: workspace back_and_forth
bind = $mainMod, B, workspace, previous

# Cycle all windows globally
bind = $mainMod, A, cyclenext

#######################################
# Move a window (or its tab group)    #
#######################################
bind = $mainMod SHIFT, left,  movewindoworgroup, l
bind = $mainMod SHIFT, right, movewindoworgroup, r
bind = $mainMod SHIFT, up,    movewindoworgroup, u
bind = $mainMod SHIFT, down,  movewindoworgroup, d
bind = $mainMod SHIFT, J, movewindoworgroup, l
bind = $mainMod SHIFT, K, movewindoworgroup, d
bind = $mainMod SHIFT, B, movewindoworgroup, u
bind = $mainMod SHIFT, O, movewindoworgroup, r

# Split orientation for next window (Super+H horizontal / Super+Shift+V vertical)
bind = $mainMod, H, layoutmsg, preselect r
bind = $mainMod SHIFT, V, layoutmsg, preselect d

#######################################
# Workspace navigation                #
#######################################
bind = $mainMod, TAB,        workspace, e+1
bind = $mainMod SHIFT, TAB,  workspace, e-1
bind = $mainMod CTRL, right,  workspace, e+1
bind = $mainMod CTRL, left,   workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind  = $mainMod SHIFT, mouse:272, exec, /home/oz/.config/hypr/scripts/group-toggle-back
bind  = $mainMod SHIFT, mouse:273, exec, hyprctl dispatch moveoutofgroup; hyprctl dispatch togglefloating
bind  = $mainMod, mouse_down, workspace, e+1
bind  = $mainMod, mouse_up,   workspace, e-1

# Window switcher
bind = $mainMod, T, exec, hyprctl -j clients | wofi --show dmenu --prompt "Switch Window"

# Toggle waybar
bind = $mainMod, M, exec, pkill waybar || waybar &

# Audio output switcher (Toggles Speakers / Headphones)
bind = $mainMod, P, exec, /home/oz/.config/hypr/scripts/audio-switcher

#######################################
# Resize mode                         #
#######################################
bind = $mainMod, R, submap, resize
submap = resize
bind = , left,  resizeactive, -20 0
bind = , right, resizeactive,  20 0
bind = , up,    resizeactive, 0 -20
bind = , down,  resizeactive, 0  20
bind = , H, resizeactive, -50 0
bind = , J, resizeactive, 0  50
bind = , K, resizeactive, 0 -50
bind = , L, resizeactive, 50  0
bind = , escape, submap, reset
bind = , return, submap, reset
bind = $mainMod, R, submap, reset
submap = reset

#######################################
# Media and hardware keys             #
#######################################
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind = $mainMod, XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 1%+
bind = $mainMod, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-
bind = , XF86MonBrightnessUp,   exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

#######################################
# Workspaces 1-10 (toggle on repeat)  #
#######################################
bind = $mainMod, 1, exec, ~/.config/hypr/scripts/workspace-toggle 1
bind = $mainMod, 2, exec, ~/.config/hypr/scripts/workspace-toggle 2
bind = $mainMod, 3, exec, ~/.config/hypr/scripts/workspace-toggle 3
bind = $mainMod, 4, exec, ~/.config/hypr/scripts/workspace-toggle 4
bind = $mainMod, 5, exec, ~/.config/hypr/scripts/workspace-toggle 5
bind = $mainMod, 6, exec, ~/.config/hypr/scripts/workspace-toggle 6
bind = $mainMod, 7, exec, ~/.config/hypr/scripts/workspace-toggle 7
bind = $mainMod, 8, exec, ~/.config/hypr/scripts/workspace-toggle 8
bind = $mainMod, 9, exec, ~/.config/hypr/scripts/workspace-toggle 9
bind = $mainMod, 0, exec, ~/.config/hypr/scripts/workspace-toggle 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
