# vim: ft=kitty

# ──────────────────────────────────────────────
# Font Configuration
# ──────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        14.0

# ──────────────────────────────────────────────
# Professional Obsidian Black & Emerald Green Theme
# ──────────────────────────────────────────────
background            #0a0c10
foreground            #f0f6fc
selection_background  #1f2937
selection_foreground  #ffffff
cursor                #00ff87
cursor_text_color     #0a0c10

# Color Palette (Black, White, Emerald & Matrix Green)
# Black / Dark Gray
color0  #161b22
color8  #484f58

# Red
color1  #f85149
color9  #ff6e6e

# Green (Emerald / Matrix Green)
color2  #10b981
color10 #00ff87

# Yellow / Amber
color3  #f59e0b
color11 #fbbf24

# Blue / Cyan
color4  #38bdf8
color12 #60a5fa

# Magenta
color5  #c084fc
color13 #e879f9

# Cyan / Teal
color6  #2dd4bf
color14 #34d399

# White (Crisp High Contrast)
color7  #f0f6fc
color15 #ffffff

# ──────────────────────────────────────────────
# Window & Layout
# ──────────────────────────────────────────────
window_padding_width    14
window_padding_height   12
hide_window_decorations yes
remember_window_size    yes
initial_window_width    920
initial_window_height   600

# Background opacity
background_opacity      0.95
dynamic_background_color yes

# ──────────────────────────────────────────────
# Powerline Tabs
# ──────────────────────────────────────────────
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_background      #0a0c10
tab_bar_margin_color    #0a0c10
active_tab_foreground   #0a0c10
active_tab_background   #10b981
inactive_tab_foreground #9ca3af
inactive_tab_background #111827
active_tab_font_style   bold

# ──────────────────────────────────────────────
# Cursor & Scrollback
# ──────────────────────────────────────────────
cursor_shape            beam
cursor_blink_interval   0.5
scrollback_lines        10000

# ──────────────────────────────────────────────
# Misc
# ──────────────────────────────────────────────
enable_audio_bell       no
confirm_os_window_close 0
