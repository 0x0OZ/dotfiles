# vim: ft=kitty

# ──────────────────────────────────────────────
# Font Configuration
# ──────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        14.0

# ──────────────────────────────────────────────
# Deep Dark Purple Theme (Tokyo Night / Mocha Purple)
# ──────────────────────────────────────────────
background            #13111c
foreground            #e2d9f3
selection_background  #4a306d
selection_foreground  #ffffff
cursor                #cba6f7
cursor_text_color     #13111c

# Color Palette (Purple/Violet/Lavender Accents)
# Black / Gray
color0  #261d36
color8  #584475

# Red / Pink
color1  #f38ba8
color9  #f5c2e7

# Green / Violet Tint
color2  #b4befe
color10 #d8b4fe

# Yellow / Gold Accent
color3  #f9e2af
color11 #f9e2af

# Blue / Lavender-Blue
color4  #9333ea
color12 #a855f7

# Magenta / Deep Purple
color5  #cba6f7
color13 #e8a2f7

# Cyan / Soft Lavender
color6  #b4befe
color14 #d8b4fe

# White
color7  #e2d9f3
color15 #ffffff

# ──────────────────────────────────────────────
# Window & Layout
# ──────────────────────────────────────────────
window_padding_width    14
window_padding_height   12
hide_window_decorations yes
remember_window_size    yes
initial_window_width    920
initial_window_height   600

# Background opacity (0.92 for subtle blur)
background_opacity      0.92
dynamic_background_color yes

# ──────────────────────────────────────────────
# Powerline Tabs
# ──────────────────────────────────────────────
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_background      #13111c
tab_bar_margin_color    #13111c
active_tab_foreground   #13111c
active_tab_background   #cba6f7
inactive_tab_foreground #b6a6d6
inactive_tab_background #1e1a2e
active_tab_font_style   bold

# ──────────────────────────────────────────────
# Cursor & Scrollback
# ──────────────────────────────────────────────
cursor_shape            beam
cursor_blink_interval   0.5
scrollback_lines        10000

# ──────────────────────────────────────────────
# Misc
# ──────────────────────────────────────────────
enable_audio_bell       no
confirm_os_window_close 0
